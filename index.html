<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-Day Weather Vision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans">

    <div class="max-w-5xl mx-auto p-4 md:p-10">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-5xl font-extrabold bg-gradient-to-r from-cyan-400 to-blue-600 bg-clip-text text-transparent">30-Day Weather Forecast</h1>
            <p class="text-slate-400 mt-2">Simple. Professional. Data-Driven.</p>
        </header>

        <!-- Search Section -->
        <div class="flex justify-center mb-8">
            <div class="relative w-full max-w-md">
                <input type="text" id="cityInput" placeholder="Enter City (e.g. Bangkok)..." 
                       class="w-full bg-slate-800 border border-slate-700 rounded-full py-3 px-6 focus:outline-none focus:ring-2 focus:ring-cyan-500 text-lg">
                <button onclick="getWeather()" class="absolute right-2 top-1.5 bg-cyan-600 hover:bg-cyan-500 px-4 py-1.5 rounded-full transition">Search</button>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <!-- Current Stats -->
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl text-center shadow-xl">
                    <h2 class="text-slate-400 uppercase text-xs tracking-widest mb-2">Estimated High</h2>
                    <p id="highTemp" class="text-6xl font-bold">--°C</p>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl text-center shadow-xl md:col-span-2">
                    <h2 class="text-slate-400 uppercase text-xs tracking-widest mb-2">30-Day Temperature Trend</h2>
                    <div class="h-48 w-full">
                        <canvas id="weatherChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Detailed Grid -->
            <h3 class="text-xl font-semibold mb-4">Daily Breakdown</h3>
            <div id="forecastGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-7 gap-3">
                <!-- Days will be injected here -->
            </div>
        </div>
    </div>

    <script>
        let myChart = null;

        async function getWeather() {
            const city = document.getElementById('cityInput').value;
            if (!city) return alert("Please enter a city name");

            // 1. Get Coordinates (Free Geocoding)
            const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1&language=en&format=json`);
            const geoData = await geoRes.json();
            
            if (!geoData.results) return alert("City not found");
            const { latitude, longitude, name } = geoData.results[0];

            // 2. Get 30-Day Forecast
            const weatherRes = await fetch(`https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${latitude}&longitude=${longitude}&daily=temperature_2m_max&timezone=auto`);
            const weatherData = await weatherRes.json();

            displayData(weatherData, name);
        }

        function displayData(data, cityName) {
            document.getElementById('dashboard').classList.remove('hidden');
            const dates = data.daily.time;
            const temps = data.daily.temperature_2m_max;

            // Update Header/High
            document.getElementById('highTemp').innerText = `${Math.max(...temps).toFixed(1)}°C`;

            // Clear old grid
            const grid = document.getElementById('forecastGrid');
            grid.innerHTML = '';

            // Inject 30-day grid
            dates.forEach((date, i) => {
                const dayCard = document.createElement('div');
                dayCard.className = "bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 text-center";
                dayCard.innerHTML = `
                    <div class="text-[10px] text-slate-500">${date.split('-').slice(1).join('/')}</div>
                    <div class="font-bold text-cyan-400">${temps[i]}°</div>
                `;
                grid.appendChild(dayCard);
            });

            // Update Chart
            if (myChart) myChart.destroy();
            const ctx = document.getElementById('weatherChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates.map(d => d.split('-')[2]), // Just the day number
                    datasets: [{
                        label: 'Max Temp (°C)',
                        data: temps,
                        borderColor: '#22d3ee',
                        borderWidth: 3,
                        tension: 0.4,
                        pointRadius: 0,
                        fill: true,
                        backgroundColor: 'rgba(34, 211, 238, 0.1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        x: { grid: { display: false }, ticks: { color: '#64748b' } },
                        y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
