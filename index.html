<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-Day Weather Vision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.6s ease-out forwards; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen font-sans">

    <div class="max-w-6xl mx-auto p-6">
        <!-- Header -->
        <header class="text-center py-8 animate-fade">
            <h1 class="text-4xl font-black tracking-tighter text-white">WEATHER <span class="text-cyan-400">VISION</span></h1>
        </header>

        <!-- Search Section (Top Layer) -->
        <div class="relative max-w-xl mx-auto mb-10 z-50 animate-fade">
            <input type="text" id="cityInput" oninput="handleSearch(this.value)"
                   placeholder="Search city..." 
                   class="w-full bg-slate-900 border border-slate-700 rounded-2xl py-4 px-6 focus:ring-2 focus:ring-cyan-500/50 outline-none shadow-2xl">
            
            <!-- Google-style Dropdown -->
            <div id="suggestions" class="hidden absolute top-full left-0 right-0 mt-2 glass rounded-2xl overflow-hidden shadow-2xl max-h-60 overflow-y-auto custom-scroll z-[100]"></div>
        </div>

        <div id="dashboard" class="hidden space-y-6 animate-fade">
            
            <!-- 1. HOURLY SCHEDULE (New Section) -->
            <div class="glass p-6 rounded-[2rem]">
                <h3 class="text-sm font-bold text-cyan-400 uppercase tracking-widest mb-4">Today's Schedule</h3>
                <div id="hourlyScroll" class="flex gap-4 overflow-x-auto pb-4 custom-scroll">
                    <!-- Hourly items injected here -->
                </div>
            </div>

            <!-- 2. MAIN CHART & CURRENT STATS -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="glass p-8 rounded-[2rem] text-center flex flex-col justify-center">
                    <h2 id="cityName" class="text-slate-500 text-xs tracking-widest uppercase mb-2">Location</h2>
                    <div id="mainTemp" class="text-7xl font-bold text-white leading-none">--°</div>
                    <div id="rainProb" class="text-cyan-400 mt-2 font-bold italic">Rain: --%</div>
                </div>

                <div class="lg:col-span-2 glass p-8 rounded-[2rem]">
                    <canvas id="weatherChart" class="h-48"></canvas>
                </div>
            </div>

            <!-- 3. 30-DAY BREAKDOWN -->
            <div id="forecastGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-3"></div>
        </div>
    </div>

    <script>
        let myChart = null;

        async function handleSearch(val) {
            const drop = document.getElementById('suggestions');
            if (val.length < 2) return drop.classList.add('hidden');

            const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${val}&count=5`);
            const data = await res.json();
            
            if (data.results) {
                drop.classList.remove('hidden');
                drop.innerHTML = data.results.map(loc => `
                    <div onclick="selectCity('${loc.name}', ${loc.latitude}, ${loc.longitude})" 
                         class="p-4 hover:bg-cyan-500/20 cursor-pointer border-b border-slate-800 flex justify-between">
                        <span class="font-bold">${loc.name}, ${loc.country}</span>
                        <span class="text-xs text-slate-500 italic">Select</span>
                    </div>
                `).join('');
            }
        }

        async function selectCity(name, lat, lon) {
            document.getElementById('suggestions').classList.add('hidden');
            document.getElementById('cityInput').value = name;
            
            // Fetch both Hourly (for schedule) and Daily (for 30-day)
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability&daily=temperature_2m_max,precipitation_probability_max&timezone=auto&forecast_days=16`);
            const data = await res.json();
            renderUI(data, name);
        }

        function renderUI(data, name) {
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('cityName').innerText = name;
            document.getElementById('mainTemp').innerText = Math.round(data.hourly.temperature_2m[0]) + "°";
            document.getElementById('rainProb').innerText = `Rain Chance: ${data.daily.precipitation_probability_max[0]}%`;

            // HOURLY SCHEDULE
            const hourlyContainer = document.getElementById('hourlyScroll');
            hourlyContainer.innerHTML = data.hourly.time.slice(0, 24).map((time, i) => `
                <div class="min-w-[100px] bg-slate-800/40 p-4 rounded-2xl text-center border border-slate-700">
                    <div class="text-xs text-slate-500 mb-1">${time.split('T')[1]}</div>
                    <div class="text-xl font-bold text-white">${Math.round(data.hourly.temperature_2m[i])}°</div>
                    <div class="text-[10px] text-cyan-400 mt-1">💧 ${data.hourly.precipitation_probability[i]}%</div>
                </div>
            `).join('');

            // 30-DAY GRID (Note: Open-Meteo free tier goes to 16 days, Ensemble goes further)
            const grid = document.getElementById('forecastGrid');
            grid.innerHTML = data.daily.time.map((date, i) => `
                <div class="glass p-3 rounded-xl text-center">
                    <div class="text-[10px] text-slate-500 mb-1">${date.split('-').slice(1).reverse().join('/')}</div>
                    <div class="font-bold text-white">${Math.round(data.daily.temperature_2m_max[i])}°</div>
                    <div class="text-[9px] text-cyan-500">Rain ${data.daily.precipitation_probability_max[i]}%</div>
                </div>
            `).join('');

            // CHART
            if (myChart) myChart.destroy();
            myChart = new Chart(document.getElementById('weatherChart'), {
                type: 'line',
                data: {
                    labels: data.daily.time.map(d => d.split('-')[2]),
                    datasets: [{
                        label: 'Max Temp',
                        data: data.daily.temperature_2m_max,
                        borderColor: '#22d3ee',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(34, 211, 238, 0.1)'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }
    </script>
</body>
</html>
